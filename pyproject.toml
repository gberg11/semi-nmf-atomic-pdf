[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-nmf-atomic-pdf"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scikit-learn"
]

[project.optional-dependencies]
# Physics-informed autoencoder (src/semi_nmf_atomic_pdf/autoencoder).
# NOTE: the diffpy stack is easiest to install via conda/conda-forge.
autoencoder = [
  "torch",
  "scipy",
  "diffpy.structure",
  "diffpy.srreal",
]
# The predictive-coding variant (seminmf_pc.py) additionally needs JAX + FabricPC
# (https://github.com/trueagi-io/FabricPC), installed separately.

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]